<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>💖 Tặng Thơm(Thúi) 💖</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div class="petals"></div> <!-- Layer hoa rơi romantic -->
  <div class="glow-overlay"></div> <!-- Ambient glow soft -->
  
  <div id="dark-mode-toggle" class="dark-mode-toggle">
    <span class="icon">☀️</span>
  </div>
  
  <div id="heart-counter" class="heart-counter">
    <span class="icon">💖</span>
    <span id="count">0</span>
  </div>
  
  <header>
    <h1 id="title">💕 Chạm vào tình yêu đuy 💕</h1>
  </header>
  
  <canvas id="canvas"></canvas>
  
  <script src="script.js"></script>
</body>
</html>
