<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌌 Tặng Thơm(Thúi) 🌌</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
</head>
<body>
  <div class="stars"></div>
  <div class="twinkling"></div>
  <div class="nebula"></div>
  <div class="clouds"></div>
  <div class="ambient-glow"></div>
  
  <div id="dark-mode-toggle" class="dark-mode-toggle">
    <span class="icon">☀️</span>
  </div>
  
  <div id="heart-counter" class="heart-counter">
    <span class="icon">❤️</span>
    <span id="count">0</span>
    <span id="high-score"> | High: 0</span>
  </div>
  
  <div id="share-button" class="share-button">📤 Share</div>
  <div id="fullscreen-toggle" class="fullscreen-toggle">🖥️ Fullscreen</div>
  
  <header>
    <h1 id="title">✨ Khám phá vũ trụ trái tim ✨</h1>
  </header>
  
  <canvas id="canvas"></canvas>
  
  <audio id="pop-sound" src="https://freesound.org/data/previews/387/387186_4282629-lq.mp3" preload="auto"></audio> <!-- Sound free, pop effect -->
  
  <script src="script.js"></script>
</body>
</html>
